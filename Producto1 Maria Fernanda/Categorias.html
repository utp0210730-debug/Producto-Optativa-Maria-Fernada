<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <title>Control de Categorías - Neon PostgreSQL</title>

    <!-- Tailwind CSS v3 CDN with forms and container-queries -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Bootstrap 5 CSS -->
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" rel="stylesheet" />

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Hoja de estilos -->
    <link href="estilos.css" rel="stylesheet" />

</head>


<body class="p-3 md:p-6 lg:p-8">

    <!-- BEGIN: MainContainer -->
    <main class="container-fluid max-w-7xl mx-auto">


        <!-- BEGIN: HeaderCard -->
        <header class="card-panel p-4 mb-4 flex justify-between items-center bg-white shadow-sm"
            data-purpose="main-header">

            <!-- Title & Database Info -->
            <div class="flex items-center gap-3">

                <span aria-label="caja de inventario" class="text-3xl leading-none" role="img">
                    📦
                </span>

                <div>

                    <h1 class="text-xl md:text-2xl font-bold text-slate-900 tracking-tight leading-none mb-1">
                        Control de Categorías
                    </h1>

                    <p class="text-xs md:text-sm text-slate-500 mb-0 font-normal">
                        Base de datos en la nube (Neon PostgreSQL)
                    </p>

                </div>

            </div>


            <!-- Header Options Menu -->
            <div class="dropdown" data-purpose="header-menu">

                <button aria-expanded="false"
                    class="btn btn-light bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 text-slate-600 hover:bg-slate-100 flex items-center gap-1.5 transition-colors"
                    data-bs-toggle="dropdown" id="headerDropdownMenu" type="button">

                    <i class="bi bi-three-dots-vertical"></i>

                    <span class="text-xs font-semibold uppercase tracking-wider hidden sm:inline">
                        Gestionar
                    </span>

                </button>


                <ul aria-labelledby="headerDropdownMenu"
                    class="dropdown-menu dropdown-menu-end shadow-lg border-slate-100 rounded-xl py-2">

                    <li>
                        <a class="dropdown-item flex items-center gap-2 py-2 text-sm text-slate-700 hover:bg-slate-50"
                            href="Categorias.html">

                            <i class="bi bi-tags text-indigo-500"></i> Categorías

                        </a>
                    </li>

                    <li>
                        <a class="dropdown-item flex items-center gap-2 py-2 text-sm text-slate-700 hover:bg-slate-50"
                            href="Index.html">

                            <i class="bi bi-box-seam text-blue-500"></i> Productos

                        </a>
                    </li>

                    <li>
                        <a class="dropdown-item flex items-center gap-2 py-2 text-sm text-slate-700 hover:bg-slate-50"
                            href="Proveedores.html">

                            <i class="bi bi-truck text-emerald-500"></i> Proveedores

                        </a>
                    </li>

                    <li>
                        <hr class="dropdown-divider border-slate-100" />
                    </li>

                    <li>
                        <button id="btn-cerrar-sesion"
                            class="dropdown-item flex items-center gap-2 py-2 text-sm text-red-600 hover:bg-slate-50"
                            type="button">

                            <i class="bi bi-box-arrow-right"></i> Cerrar sesión

                        </button>
                    </li>

                </ul>
            </div>

        </header>
        <!-- END: HeaderCard -->


        <!-- BEGIN: TwoColumnLayout -->
        <div class="row g-4">


            <!-- BEGIN: LeftColumn (Current Categories) -->
            <section class="col-12 col-lg-7 col-xl-8" data-purpose="inventory-display-section">

                <div class="card-panel p-4 h-full flex flex-col justify-between">

                    <div>

                        <!-- Section Header -->
                        <div class="flex items-center justify-between pb-3 mb-2 border-b border-slate-100">

                            <h2 class="text-lg font-bold text-slate-800 tracking-tight mb-0">
                                Categorías Actuales
                            </h2>

                            <span id="total-categorias"
                                class="badge bg-indigo-50 text-indigo-600 rounded-pill px-3 py-1.5 font-medium text-xs">

                                Total: 0 registros

                            </span>

                        </div>


                        <!-- Table Responsive Container -->
                        <div class="table-responsive">

                            <table class="table align-middle mb-0">

                                <thead>

                                    <tr>

                                        <th class="ps-2" scope="col">
                                            ID CATEGORÍA
                                        </th>

                                        <th scope="col">
                                            NOMBRE
                                        </th>

                                        <th scope="col">
                                            DESCRIPCIÓN
                                        </th>

                                    </tr>

                                </thead>


                                <tbody id="categorias-body">

                                </tbody>

                            </table>

                        </div>

                    </div>


                    <!-- Bottom Status Footer -->
                    <div
                        class="pt-4 mt-6 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2 text-xs text-slate-500">

                        <div class="flex items-center gap-2">

                            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block animate-pulse">
                            </span>

                            <span class="font-medium text-slate-600">
                                Conectado a Neon PostgreSQL
                            </span>

                        </div>


                        <button id="btn-refrescar-categorias"
                            class="text-indigo-600 hover:text-indigo-800 font-semibold inline-flex items-center gap-1 transition-colors"
                            type="button">

                            <i class="bi bi-arrow-clockwise"></i>
                            Refrescar

                        </button>

                    </div>

                </div>

            </section>
            <!-- END: LeftColumn -->


            <!-- BEGIN: RightColumn (Forms / Actions) -->
            <section class="col-12 col-lg-5 col-xl-4 flex flex-col gap-4" data-purpose="actions-sidebar">


                <!-- BEGIN: Card Nueva Categoría -->
                <article class="card-panel p-4" data-purpose="form-nuevo-producto">

                    <div class="flex items-center gap-2 mb-3">

                        <span class="text-purple-600 text-lg leading-none font-bold">
                            ➕
                        </span>

                        <h3 class="text-base font-bold text-slate-800 mb-0">
                            Nueva Categoría
                        </h3>

                    </div>


                    <form id="category-form">

                        <!-- Nombre -->
                        <div class="row g-2 mb-2">

                            <div class="col-12">

                                <input id="cat_nombre" class="form-control" placeholder="Nombre" type="text" required />

                            </div>

                        </div>


                        <!-- Descripción -->
                        <div class="row g-2 mb-3">

                            <div class="col-12">

                                <textarea id="cat_descripcion" class="form-control" placeholder="Descripción"
                                    rows="3"></textarea>

                            </div>

                        </div>


                        <!-- Submit Button -->
                        <button class="btn btn-product w-full py-2 shadow-sm" type="submit">

                            Registrar Categoría

                        </button>

                    </form>

                </article>
                <!-- END: Card Nueva Categoría -->


                <!-- BEGIN: Card Eliminar Categoría -->
                <article class="card-panel p-4" data-purpose="form-nuevo-producto">

                    <div class="flex items-center gap-2 mb-3">

                        <span class="text-purple-600 text-lg leading-none font-bold">
                            🗑️
                        </span>

                        <h3 class="text-base font-bold text-slate-800 mb-0">
                            Eliminar Categoría
                        </h3>

                    </div>


                    <form id="delete-category-form">

                        <div class="row g-3">

                            <div class="col-12">

                                <input id="delete_cat_id" class="form-control" placeholder="ID de la categoría"
                                    type="number" min="1" required />

                            </div>


                            <div class="col-12">

                                <button type="submit" class="btn btn-danger w-100">

                                    Eliminar Categoría

                                </button>

                            </div>

                        </div>

                    </form>

                </article>
                <!-- END: Card Eliminar Categoría -->


                <!-- BEGIN: Card Actualizar Categoría -->
                <article class="card-panel p-4" data-purpose="form-nuevo-producto">

                    <div class="flex items-center gap-2 mb-3">

                        <span class="text-purple-600 text-lg leading-none font-bold">
                            ✏️
                        </span>

                        <h3 class="text-base font-bold text-slate-800 mb-0">
                            Actualizar Categoría
                        </h3>

                    </div>


                    <form id="update-category-form">

                        <div class="row g-3">

                            <!-- ID de la categoría -->
                            <div class="col-12">

                                <input id="update_cat_id" class="form-control" placeholder="ID de la categoría"
                                    type="number" min="1" required />

                            </div>


                            <!-- Nombre -->
                            <div class="col-12">

                                <input id="update_cat_nombre" class="form-control" placeholder="Nombre de la categoría"
                                    type="text" required />

                            </div>


                            <!-- Descripción -->
                            <div class="col-12">

                                <textarea id="update_cat_descripcion" class="form-control"
                                    placeholder="Descripción de la categoría" rows="3"></textarea>

                            </div>


                            <!-- Botón -->
                            <div class="col-12">

                                <button type="submit" class="btn btn-primary w-100">

                                    Actualizar Categoría

                                </button>

                            </div>

                        </div>

                    </form>

                </article>
                <!-- END: Card Actualizar Categoría -->


            </section>
            <!-- END: RightColumn -->


        </div>
        <!-- END: TwoColumnLayout -->


    </main>
    <!-- END: MainContainer -->


    <!-- Bootstrap 5 JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <!-- JAVASCRIPT -->
    <script>

    const API_URL = "http://localhost:5042/api";


    // =========================
    // INICIALIZAR MENÚ
    // =========================

    const botonMenu = document.getElementById("headerDropdownMenu");

    if (botonMenu && typeof bootstrap !== "undefined") {
        new bootstrap.Dropdown(botonMenu);
    }


    // =========================
    // CONTROL DE ACCESO
    // =========================

    const rol = localStorage.getItem("rol");

    // Solo el administrador puede entrar
    if (rol !== "administrador") {

        window.location.href = "Index.html";

    }


    // =========================
    // CERRAR SESIÓN
    // =========================

    const btnCerrarSesion =
        document.getElementById("btn-cerrar-sesion");

    if (btnCerrarSesion) {

        btnCerrarSesion.addEventListener(
            "click",
            () => {

                localStorage.removeItem("rol");

                localStorage.removeItem("usuario");

                window.location.href = "Login.html";

            }
        );

    }


    // =========================
    // CARGAR CATEGORÍAS
    // =========================

    async function cargarCategorias() {

        try {

            const respuesta =
                await fetch(
                    `${API_URL}/Categorias`
                );


            if (!respuesta.ok) {

                throw new Error(
                    "Error al obtener las categorías"
                );

            }


            const categorias =
                await respuesta.json();


            console.log(
                "Categorías recibidas:",
                categorias
            );


            const tbody =
                document.getElementById(
                    "categorias-body"
                );


            if (!tbody) {

                console.error(
                    "No se encontró el tbody categorias-body"
                );

                return;

            }


            tbody.innerHTML = "";


            categorias.forEach(categoria => {

                const fila = `

                    <tr class="hover:bg-slate-50 transition-colors">

                        <td class="ps-2">

                            <div class="font-semibold text-slate-800">

                                ${categoria.id_categoria}

                            </div>

                        </td>


                        <td>

                            <div class="font-semibold text-slate-800">

                                ${categoria.nombre ?? ""}

                            </div>

                        </td>


                        <td class="text-slate-600 text-sm">

                            ${categoria.descripcion ?? "Sin descripción"}

                        </td>

                    </tr>

                `;


                tbody.innerHTML += fila;

            });


            const total =
                document.getElementById(
                    "total-categorias"
                );


            if (total) {

                total.textContent =
                    `Total: ${categorias.length} registros`;

            }

        }
        catch (error) {

            console.error(
                "Error al cargar categorías:",
                error
            );

        }

    }


    // =========================
    // REGISTRAR NUEVA CATEGORÍA
    // =========================

    document
        .getElementById("category-form")
        .addEventListener(
            "submit",
            async (e) => {

                e.preventDefault();


                const categoria = {

                    nombre:
                        document.getElementById(
                            "cat_nombre"
                        ).value,


                    descripcion:
                        document.getElementById(
                            "cat_descripcion"
                        ).value

                };


                if (!categoria.nombre) {

                    alert(
                        "Ingresa el nombre de la categoría."
                    );

                    return;

                }


                try {

                    const respuesta =
                        await fetch(
                            `${API_URL}/Categorias`,
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(categoria)

                            }
                        );


                    if (!respuesta.ok) {

                        const mensaje =
                            await respuesta.text();

                        throw new Error(mensaje);

                    }


                    const categoriaCreada =
                        await respuesta.json();


                    console.log(
                        "Categoría creada:",
                        categoriaCreada
                    );


                    alert(
                        "Categoría registrada correctamente."
                    );


                    document
                        .getElementById(
                            "category-form"
                        )
                        .reset();


                    await cargarCategorias();

                }
                catch (error) {

                    console.error(
                        "Error al registrar categoría:",
                        error
                    );

                    alert(error.message);

                }

            }
        );


    // =========================
    // CARGAR CATEGORÍA PARA ACTUALIZAR
    // =========================

    document
        .getElementById("update_cat_id")
        .addEventListener(
            "change",
            async () => {

                const id =
                    document.getElementById(
                        "update_cat_id"
                    ).value;


                if (!id) {

                    return;

                }


                try {

                    const respuesta =
                        await fetch(
                            `${API_URL}/Categorias/${id}`
                        );


                    if (!respuesta.ok) {

                        if (
                            respuesta.status === 404
                        ) {

                            throw new Error(
                                "No se encontró la categoría."
                            );

                        }


                        throw new Error(
                            "Error al buscar la categoría."
                        );

                    }


                    const categoria =
                        await respuesta.json();


                    console.log(
                        "Categoría encontrada para actualizar:",
                        categoria
                    );


                    document.getElementById(
                        "update_cat_nombre"
                    ).value =
                        categoria.nombre ?? "";


                    document.getElementById(
                        "update_cat_descripcion"
                    ).value =
                        categoria.descripcion ?? "";

                }
                catch (error) {

                    console.error(
                        "Error al buscar categoría:",
                        error
                    );

                    alert(error.message);

                }

            }
        );


    // =========================
    // ACTUALIZAR CATEGORÍA
    // =========================

    document
        .getElementById("update-category-form")
        .addEventListener(
            "submit",
            async (e) => {

                e.preventDefault();


                const id =
                    Number(
                        document.getElementById(
                            "update_cat_id"
                        ).value
                    );


                const categoria = {

                    id_categoria: id,

                    nombre:
                        document.getElementById(
                            "update_cat_nombre"
                        ).value,

                    descripcion:
                        document.getElementById(
                            "update_cat_descripcion"
                        ).value

                };


                if (
                    !categoria.id_categoria ||
                    !categoria.nombre
                ) {

                    alert(
                        "Completa correctamente todos los campos."
                    );

                    return;

                }


                try {

                    const respuesta =
                        await fetch(
                            `${API_URL}/Categorias/${id}`,
                            {

                                method: "PUT",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(categoria)

                            }
                        );


                    if (!respuesta.ok) {

                        const mensaje =
                            await respuesta.text();

                        throw new Error(mensaje);

                    }


                    const categoriaActualizada =
                        await respuesta.json();


                    console.log(
                        "Categoría actualizada:",
                        categoriaActualizada
                    );


                    alert(
                        "Categoría actualizada correctamente."
                    );


                    document
                        .getElementById(
                            "update-category-form"
                        )
                        .reset();


                    await cargarCategorias();

                }
                catch (error) {

                    console.error(
                        "Error al actualizar categoría:",
                        error
                    );

                    alert(error.message);

                }

            }
        );


    // =========================
    // ELIMINAR CATEGORÍA
    // =========================

    document
        .getElementById("delete-category-form")
        .addEventListener(
            "submit",
            async (e) => {

                e.preventDefault();


                const id =
                    document.getElementById(
                        "delete_cat_id"
                    ).value;


                if (!id) {

                    alert(
                        "Ingresa el ID de la categoría."
                    );

                    return;

                }


                const confirmar =
                    confirm(
                        `¿Seguro que quieres eliminar la categoría con ID ${id}?`
                    );


                if (!confirmar) {

                    return;

                }


                try {

                    const respuesta =
                        await fetch(
                            `${API_URL}/Categorias/${id}`,
                            {
                                method: "DELETE"
                            }
                        );


                    if (!respuesta.ok) {

                        const mensaje =
                            await respuesta.text();

                        throw new Error(mensaje);

                    }


                    const mensaje =
                        await respuesta.text();


                    console.log(
                        "Categoría eliminada:",
                        mensaje
                    );


                    alert(
                        "Categoría eliminada correctamente."
                    );


                    document
                        .getElementById(
                            "delete-category-form"
                        )
                        .reset();


                    await cargarCategorias();

                }
                catch (error) {

                    console.error(
                        "Error al eliminar categoría:",
                        error
                    );

                    alert(error.message);

                }

            }
        );


    // =========================
    // BOTÓN REFRESCAR
    // =========================

    document
        .getElementById("btn-refrescar-categorias")
        .addEventListener(
            "click",
            async () => {

                await cargarCategorias();

            }
        );


    // =========================
    // INICIAR
    // =========================

    cargarCategorias();

</script>

</body>

</html>
