<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Iniciar Sesión - Control de Inventario</title>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
    }

    .brand-icon-box {
      width: 64px;
      height: 64px;
      background-color: #eef2ff;
      border: 1px solid #e0e7ff;
      border-radius: 1.25rem;
    }

    .btn-brand {
      background-color: #4f46e5;
      border-color: #4f46e5;
      color: #ffffff;
      box-shadow: 0 4px 14px 0 rgba(79, 70, 229, 0.35);
      transition: all 0.2s ease-in-out;
    }

    .btn-brand:hover,
    .btn-brand:focus,
    .btn-brand:active {
      background-color: #4338ca !important;
      border-color: #4338ca !important;
      color: #ffffff !important;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px 0 rgba(79, 70, 229, 0.45);
    }

    .form-select-custom {
      border-color: #e2e8f0;
      background-color: #f8fafc;
      font-size: 0.95rem;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      color: #1e293b;
    }

    .form-select-custom:focus {
      border-color: #6366f1;
      background-color: #ffffff;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }

    .pulse-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }

      70% {
        transform: scale(1);
        box-shadow: 0 0 0 6px rgba(16, 185, 129, 0);
      }

      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }
  </style>
</head>

<body class="d-flex min-vh-100 align-items-center justify-content-center py-5">
  <main class="container" data-purpose="login-container" style="max-width: 480px;">
    <!-- Header with logo and title -->
    <header class="text-center mb-4" data-purpose="app-branding">
      
      <h1 class="h3 fw-bold text-dark mb-1 tracking-tight">Control de Inventario</h1>
    </header>
    <!-- Authentication Card -->
    <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 bg-white" data-purpose="login-card">
      <div class="border-bottom pb-3 mb-4">
        <h2 class="h6 fw-bold text-dark mb-1">Bienvenido al sistema</h2>
        <p class="text-secondary small mb-0">Ingresa tus credenciales para acceder al sistema</p>
      </div>
      <form action="#" data-purpose="login-form" method="POST" onsubmit="event.preventDefault();">
        <!-- Field: Role Selection -->
        <div class="mb-3"><label class="form-label fw-semibold text-secondary small text-uppercase mb-2"
            for="user-username">Usuario <span class="text-danger">*</span></label><input type="text"
            class="form-control form-control-lg form-select-custom w-100" id="user-username" name="username"
            placeholder="Ingresa tu usuario" required=""></div>
        <div class="mb-4"><label class="form-label fw-semibold text-secondary small text-uppercase mb-2"
            for="user-password">Contraseña <span class="text-danger">*</span></label><input type="password"
            class="form-control form-control-lg form-select-custom w-100" id="user-password" name="password"
            placeholder="••••••••" required=""></div>
        <!-- Submit Button -->
        <button
          class="btn btn-brand btn-lg w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2"
          type="submit">
          <span class="">Iniciar sesión</span>
          
        </button>
      </form>
      <!-- Card Footer Status -->
      <footer class="mt-4 pt-3 border-top d-flex align-items-center justify-content-between text-secondary"
        style="font-size: 0.75rem;">
        <div class="d-flex align-items-center gap-2">
         
          
        </div>
       
      </footer>
    </div>
    <!-- System Copyright Footer -->
    
  </main>
  <!-- Bootstrap 5 JavaScript Bundle -->
  <script crossorigin="anonymous" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>

    // =========================
    // INICIAR SESIÓN
    // =========================

    document.querySelector('[data-purpose="login-form"]')
      .addEventListener("submit", async function (e) {

        e.preventDefault();

        const usuario =
          document.getElementById("user-username").value;

        const contraseña =
          document.getElementById("user-password").value;

        try {

          const respuesta = await fetch(
            "http://localhost:5042/api/Roles/login",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                usuario: usuario,
                contraseña: contraseña
              })
            }
          );

          const datos = await respuesta.json();

          if (!respuesta.ok) {
            alert(datos.mensaje || "Usuario o contraseña incorrectos.");
            return;
          }

          // Guardamos el rol obtenido desde la API
          localStorage.setItem("rol", datos.tipo_rol);

          // También podemos guardar el usuario
          localStorage.setItem("usuario", datos.usuario);

          // Entramos al sistema
          window.location.href = "Index.html";

        } catch (error) {

          console.error("Error al iniciar sesión:", error);

          alert("No se pudo conectar con el servidor.");
        }

      });
  </script>
</body>

</html>
